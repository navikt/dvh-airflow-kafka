name: Deploy Kafka canary to dev

on:
  push:
    branches:
      - dvh-union-kafka
    paths:
      - '.nais/kafka-canary-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-kafka-canary-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Kafka canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@3944168fd20b7eea3818e97de3810f74b54c78ff # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/kafka-canary-dev.yml
